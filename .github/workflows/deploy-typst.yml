name: Compile and deploy typst PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: typst-community/setup-typst@v5

      - name: Compile PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public

          for source in */*.typ; do
            [ -f "$source" ] || continue

            folder="${source%%/*}"
            filename="$(basename "$source" .typ)"

            mkdir -p "public/$folder"

            echo "Compiling $source"
            typst compile "$source" "public/$folder/$filename.pdf"
          done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - uses: actions/deploy-pages@v4
        id: deployment
